---
version: '2'
run:
  timeout: 5m
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - copyloopvar
    - dupl
    - embeddedstructfieldcheck
    - err113
    - errorlint
    - funcorder
    - gochecknoglobals
    - goconst
    - gocritic
    - godot
    - inamedparam
    - lll
    - modernize
    - revive
    - errname
    - exhaustive
    - funlen
    - reassign